<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>PSP Rep Feed</title>
    <meta name="description" content="Puget Sound Pipe & Supply — rep feed, order capture, and CRM in one app." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#33383D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PSP Rep Feed" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />

    <!--
      Tailwind via the Play CDN — the app was built against Claude.ai's
      built-in Tailwind runtime and uses only core utility classes, so this
      is a drop-in zero-config swap. It's fine for an internal tool at this
      scale; if this grows into something with real traffic, swap this for
      a proper Tailwind build step (postcss + tailwindcss as devDependencies,
      an index.css with @tailwind directives) to cut the JS payload and
      remove the runtime compile — same classes, no app code changes needed.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
