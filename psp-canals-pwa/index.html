<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Canals Order Capture</title>
    <meta name="description" content="Capture a field order — photo, typed, or spoken — and send it straight to the Canals inbox." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1F4D99" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Canals Capture" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />

    <!--
      Tailwind via the Play CDN, same zero-config approach as the parent
      psp-app project — fine at this scale (small internal tool).
    -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
